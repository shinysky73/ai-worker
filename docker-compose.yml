version: "3.8"

services:
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGIN=http://localhost:5174
    volumes:
      - uploads:/app/uploads

  user-client:
    build:
      context: .
      dockerfile: apps/user-client/Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - api-server

volumes:
  uploads:
